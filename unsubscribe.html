<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Unsubscribe | BJ Hufstetler</title>
        <meta name="robots" content="noindex">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/styles.css">
        <link rel="icon" href="/public/favicon.ico" type="image/x-icon">
    </head>
    <body class="page">
        <header class="author-head">
            <h1>Thanks for reading!</h1>
        </header>
        <main class="card">
            <p>Thank you so much for joining me. Hope you enjoyed your time!</p>
            <div class="signup-form">
                <form class="signup" data-action="unsubscribe">
                    <label for="txt-signup" class="visually-hidden">Email address</label>
                    <input id="txt-signup" type="email" name="email" placeholder="Your email" autocomplete="email" required>
                    <input type="hidden" name="action" value="unsubscribe">
                    <div>
                        <button type="submit">Unsubscribe</button>
                    </div>
                    <p class="form-status" role="status" aria-live="polite"></p>
                </form>
            </div>
            <p class="small-note"><a href="/">Back to bjhufstetler.com</a></p>
        </main>

        <script src="/signup.js" defer></script>
    </body>
</html>
