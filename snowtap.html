<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Epoch of Kepler: Snowtap | BJ Hufstetler</title>
  <meta name="description" content="Mentally trapped in the past, Kepler embarks upon the opportunity of a lifetime with the potential to change his and his family's future. Read The Epoch of Kepler: Snowtap by BJ Hufstetler.">
  <link rel="canonical" href="https://bjhufstetler.com/snowtap.html">
  <meta property="og:type" content="book">
  <meta property="og:url" content="https://bjhufstetler.com/snowtap.html">
  <meta property="og:title" content="The Epoch of Kepler: Snowtap">
  <meta property="og:description" content="Mentally trapped in the past, Kepler embarks upon the opportunity of a lifetime with the potential to change his and his family's future.">
  <meta property="og:image" content="https://bjhufstetler.com/Snowtap/imgs/cover-social.jpg">
  <meta property="og:image:alt" content="Cover of The Epoch of Kepler: Snowtap">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:creator" content="@bjhufstetler">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/public/snowtap.ico" type="image/x-icon">
</head>
<body>
  <div class="page">
    <header class="page-header">
      <a href="/">Home</a>
      <span>The Epoch of Kepler: Snowtap</span>
    </header>

    <!-- Chapter Dropdown -->
    <nav class="chapter-dropdown">
      <label for="chapter-select">Select Chapter:</label>
      <select id="chapter-select">
        <option value="">-- Cover --</option>
      </select>
    </nav>

    <!-- Cover Section -->
    <div id="toc">
      <p class="update-banner">Last update: <i><span id="txt-update"></span></i>.</p>
      <div class="book-img">
        <a href="#01" class="img-link">
          <img src="/Snowtap/imgs/cover-front.webp" width="900" height="1324" alt="Cover of The Epoch of Kepler: Snowtap">
        </a>
      </div>
      <p class="start-reading"><a href="#01" class="button-link">Start reading at Chapter 1</a></p>

      <section class="card">
        <h2>Stay Informed</h2>
        <p>Sign up for updates about BJ Hufstetler and Kepler's Saga.</p>
        <div class="signup-form">
          <form class="signup" data-action="subscribe">
            <label for="txt-signup" class="visually-hidden">Email address</label>
            <input id="txt-signup" type="email" name="email" placeholder="Your email" autocomplete="email" required>
            <input type="hidden" name="action" value="subscribe">
            <div>
              <button type="submit">Subscribe</button>
            </div>
            <p class="form-status" role="status" aria-live="polite"></p>
          </form>
          <p class="small-note">Already subscribed? <a href="/unsubscribe.html">Unsubscribe here</a>.</p>
        </div>
      </section>
    </div>

    <!-- Chapter Content Section -->
    <main id="chapter-content" hidden>
      <h1 class="chapter" id="chapter-title"></h1>
      <p class="chapter-name" id="chapter-name"></p>
      <div id="output"></div>
      <nav class="chapter-nav" id="chapter-nav"></nav>

      <!-- Fan Submissions -->
      <section class="fan-submissions" id="fan-submissions">
        <h2 class="fan-header">Fan Art</h2>
        <p class="fan-submission">
          Join the community and discussion. <br>
          Submit art or comments to <a href="mailto:self@bjhufstetler.com">self@bjhufstetler.com</a>
        </p>
        <div id="fanart" class="fanart"></div>
      </section>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

       /**
       *  _    _ _____  _____       _______ ______   _    _ ______ _____  ______
       * | |  | |  __ \|  __ \   /\|__   __|  ____| | |  | |  ____|  __ \|  ____|
       * | |  | | |__) | |  | | /  \  | |  | |__    | |__| | |__  | |__) | |__
       * | |  | |  ___/| |  | |/ /\ \ | |  |  __|   |  __  |  __| |  _  /|  __|
       * | |__| | |    | |__| / ____ \| |  | |____  | |  | | |____| | \ \| |____
       *  \____/|_|  __|_____/_/    \_\_|  |______| |_|  |_|______|_|  \_\______|
       *
       *             \ \    / /
       *              \ \  / /
       *               \ \/ /
       *                \  /
       *                 \/                                                      */
      const maxChapter = 13;
      const updateDate = "3/23/26";

      // Fan art goes in Snowtap/imgs/ as <chapter>-<n>.webp, .jpg or .png
      // (e.g. 05-1.png, 05-2.jpg). They are shown in order until a number is missing.
      const fanArtExtensions = ['webp', 'jpg', 'png'];

      const toc = document.getElementById('toc');
      const chapterContent = document.getElementById('chapter-content');
      const chapterTitle = document.getElementById('chapter-title');
      const chapterName = document.getElementById('chapter-name');
      const output = document.getElementById('output');
      const chapterNav = document.getElementById('chapter-nav');
      const fanSection = document.getElementById('fan-submissions');
      const fanart = document.getElementById('fanart');
      const chapterSelect = document.getElementById('chapter-select');
      const baseTitle = document.title;

      document.getElementById('txt-update').textContent = updateDate;

      const pad = n => String(n).padStart(2, '0');

      for (let i = 1; i <= maxChapter; i++) {
        const option = document.createElement('option');
        option.value = pad(i);
        option.textContent = `${i}`;
        chapterSelect.appendChild(option);
      }

      // The address bar (#01, #02, ...) is the single source of truth for what is
      // shown, so refresh, bookmarks, shared links and the back button all work.
      let loadToken = 0;

      function route() {
        const match = window.location.hash.match(/^#(\d+)$/);
        if (match) showChapter(parseInt(match[1], 10));
        else showCover();
      }

      function showCover() {
        loadToken++;
        toc.hidden = false;
        chapterContent.hidden = true;
        chapterSelect.value = '';
        document.title = baseTitle;
      }

      function formatChapter(text) {
        text = text.replace(/\\newchapter\{.*?\}/g, '');
        text = text.replace(/\\lettrine\[.*?\]\{(.*?)\}\{(.*?)\}/g, (match, drop, rest) => {
          return `<span class="dropcap">${drop}</span>${rest}`;
        });
        text = text.replace(/\\textit\{(.*?)\}/g, '<i>$1</i>');
        text = text.replace(/\\threedots/g, '<div class="dots">***</div>');
        const paragraphs = text.trim().split(/\n\s*\n/);
        return `<div class="pb">${paragraphs.map(p => `<div>${p.trim()}</div>`).join('\n')}</div>`;
      }

      function showChapter(n) {
        const token = ++loadToken;
        const chNum = pad(n);
        chapterSelect.value = n <= maxChapter ? chNum : '';

        fetch(`/Snowtap/chapters/ch${chNum}.txt`)
          .then(res => {
            if (!res.ok) throw new Error('Chapter not available.');
            return res.text();
          })
          .then(text => {
            if (token !== loadToken) return; // reader already moved on
            const nameMatch = text.match(/\\newchapter\{(.*?)\}/);
            const name = nameMatch ? nameMatch[1] : '';

            chapterTitle.textContent = `Chapter ${n}`;
            chapterName.textContent = name;
            document.title = `Chapter ${n}${name ? ': ' + name : ''} | The Epoch of Kepler`;
            output.innerHTML = formatChapter(text);

            const prev = n > 1 ? `<a href="#${pad(n - 1)}">&larr; Previous Chapter</a>` : '<span></span>';
            const next = `<a href="#${n < maxChapter ? pad(n + 1) : '99'}">Next Chapter &rarr;</a>`;
            chapterNav.innerHTML = prev + next;

            fanSection.hidden = false;
            loadFanArt(chNum, n, token);
            showContent();
          })
          .catch(err => {
            if (token !== loadToken) return;
            chapterTitle.textContent = 'Coming Soon';
            chapterName.textContent = '';
            document.title = baseTitle;
            output.innerHTML = '<p>Join the <a href="#">mailing list</a> to be notified when this chapter becomes available.</p>';
            chapterNav.innerHTML = `<a href="#${pad(maxChapter)}">&larr; Back to Chapter ${maxChapter}</a><span></span>`;
            fanSection.hidden = true;
            fanart.innerHTML = '';
            showContent();
            console.warn('Chapter not yet available:', err);
          });
      }

      function showContent() {
        toc.hidden = true;
        chapterContent.hidden = false;
        window.scrollTo(0, 0);
      }

      // Show fan art <chapter>-1, -2, ... trying each file type, until one is missing.
      function loadFanArt(chNum, n, token) {
        fanart.innerHTML = '';
        function tryImage(index, extIndex) {
          if (token !== loadToken || extIndex >= fanArtExtensions.length) return;
          const img = new Image();
          img.onload = () => {
            if (token !== loadToken) return;
            img.alt = `Fan art for Chapter ${n}`;
            const container = document.createElement('div');
            container.className = 'fan-credit';
            container.appendChild(img);
            fanart.appendChild(container);
            tryImage(index + 1, 0);
          };
          img.onerror = () => tryImage(index, extIndex + 1);
          img.src = `/Snowtap/imgs/${chNum}-${index}.${fanArtExtensions[extIndex]}`;
        }
        tryImage(1, 0);
      }

      chapterSelect.addEventListener('change', e => {
        window.location.hash = e.target.value; // '' goes back to the cover
      });

      window.addEventListener('hashchange', route);
      route();
    });
  </script>
  <script src="/signup.js" defer></script>
</body>
</html>
